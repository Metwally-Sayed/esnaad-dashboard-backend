name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'esnaad-dashboard-backend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:  # Allows manual trigger

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  IMAGE_NAME: esnaad-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./esnaad-dashboard-backend
          file: ./esnaad-dashboard-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/esnaad-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/esnaad-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed to Docker Hub as ${{ secrets.DOCKER_HUB_USERNAME }}/esnaad-backend:latest"