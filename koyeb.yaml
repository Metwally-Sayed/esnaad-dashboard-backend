app:
  name: esnaad-backend

services:
  - name: api
    type: web

    # Build configuration
    build:
      type: buildpack
      buildCommand: npm install && npm run build && npm run prisma:generate

    # Runtime configuration
    run:
      command: npm run start

    # Port configuration
    ports:
      - port: 8080
        protocol: http

    # Health check
    healthChecks:
      - path: /health
        port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10

    # Resources (free tier)
    instanceTypes:
      - type: nano

    # Scaling
    scaling:
      min: 1
      max: 1

    # Region
    regions:
      - fra  # Frankfurt (or use 'was' for Washington, 'sin' for Singapore)